<header class="navbar" [class.scrolled]="isScrolled()">
  <div class="navbar__inner">
    <a routerLink="/" class="navbar__logo" (click)="closeMobile()">
      <span class="logo-mark">AH</span>
      <span class="logo-text">Arthur Holsbeke</span>
    </a>

    <nav class="navbar__links" [class.open]="mobileMenuOpen()">
      @for (link of navLinks; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: link.path === '/' }"
          class="nav-link"
          (click)="closeMobile()"
        >
          {{ link.label }}
        </a>
      }
    </nav>

    <button class="navbar__hamburger" (click)="toggleMobile()" [class.open]="mobileMenuOpen()" aria-label="Toggle menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>
</header>
